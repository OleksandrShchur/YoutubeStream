name: OCI Create Instance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure OCI credentials
        env:
          OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\ntenancy=%s\nfingerprint=%s\nkey_file=/home/runner/.oci/oci_api_key.pem\nregion=%s\n' \
            "$OCI_CLI_USER" "$OCI_CLI_TENANCY" "$OCI_CLI_FINGERPRINT" "$OCI_CLI_REGION" \
            > ~/.oci/config

          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> $GITHUB_ENV

      - name: Debug OCI config
        run: |
          echo "=== ~/.oci/config ==="
          cat ~/.oci/config
          echo "=== Fixing permissions ==="
          oci setup repair-file-permissions --file ~/.oci/config || true
          echo "Permissions fixed."

      - name: Check for existing instance
        id: check
        run: |
          COMPARTMENT_ID="${{ secrets.OCI_COMPARTMENT_ID }}"
          EXISTING=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "instance-20260319-1131" \
            --lifecycle-state RUNNING \
            --query "data[0].id" \
            --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Instance already running: $EXISTING"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No running instance found - will attempt creation."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate or reuse SSH key pair
        if: steps.check.outputs.exists == 'false'
        id: ssh
        env:
          GH_TOKEN:   ${{ secrets.GH_PAT }}
          REPO:       ${{ github.repository }}
          STORED_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$STORED_KEY" ]; then
            echo "Generating new SSH key pair..."
            ssh-keygen -t rsa -b 4096 -f ~/.ssh/oci_instance_key -N "" -C "oci-instance-auto"
            pip install PyNaCl --quiet

            python3 -c "
          import base64, json, os, urllib.request
          from nacl import public as nacl_public

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          api   = 'https://api.github.com/repos/' + repo + '/actions'

          def get_pub_key():
              req = urllib.request.Request(api + '/secrets/public-key',
                    headers={'Authorization': 'Bearer ' + token,
                             'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def encrypt(pub_key_b64, secret_value):
              pub_key_bytes = base64.b64decode(pub_key_b64)
              box = nacl_public.SealedBox(nacl_public.PublicKey(pub_key_bytes))
              return base64.b64encode(box.encrypt(secret_value.encode())).decode()

          def save_secret(name, value, key_id, pub_key_b64):
              body = json.dumps({'encrypted_value': encrypt(pub_key_b64, value), 'key_id': key_id}).encode()
              req = urllib.request.Request(api + '/secrets/' + name, data=body, method='PUT',
                    headers={'Authorization': 'Bearer ' + token,
                             'Content-Type': 'application/json',
                             'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as r:
                  print('Saved secret ' + name + ': HTTP ' + str(r.status))

          key_info = get_pub_key()
          with open(os.path.expanduser('~/.ssh/oci_instance_key.pub')) as f:
              pub = f.read().strip()
          with open(os.path.expanduser('~/.ssh/oci_instance_key')) as f:
              priv = f.read()
          save_secret('OCI_SSH_PUBLIC_KEY',  pub,  key_info['key_id'], key_info['key'])
          save_secret('OCI_SSH_PRIVATE_KEY', priv, key_info['key_id'], key_info['key'])
          print('Both keys saved to GitHub Secrets.')
          "

            PUB_KEY=$(cat ~/.ssh/oci_instance_key.pub)
            echo "pub_key=$PUB_KEY" >> $GITHUB_OUTPUT
          else
            echo "SSH key already exists, reusing it."
            echo "pub_key=$STORED_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Create OCI instance (try up to 3 ADs) - FIXED VERSION
        if: steps.check.outputs.exists == 'false'
        id: create
        continue-on-error: true
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SUBNET_ID:      ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID:       ${{ secrets.OCI_IMAGE_ID }}
        run: |
          PUB_KEY="${{ steps.ssh.outputs.pub_key }}"
          if [ -z "$PUB_KEY" ]; then PUB_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"; fi
          echo "$PUB_KEY" > /tmp/ssh_pub_key.pub

          AGENT='{"isMonitoringDisabled":false,"isManagementDisabled":true,"pluginsConfig":[{"name":"Vulnerability Scanning","desiredState":"DISABLED"},{"name":"Management Agent","desiredState":"DISABLED"},{"name":"Custom Logs Monitoring","desiredState":"ENABLED"},{"name":"Compute RDMA GPU Monitoring","desiredState":"DISABLED"},{"name":"Compute Instance Monitoring","desiredState":"ENABLED"},{"name":"Compute HPC RDMA Auto-Configuration","desiredState":"DISABLED"},{"name":"Compute HPC RDMA Authentication","desiredState":"DISABLED"},{"name":"Cloud Guard Workload Protection","desiredState":"ENABLED"},{"name":"Block Volume Management","desiredState":"DISABLED"},{"name":"Bastion","desiredState":"DISABLED"}]}'

          echo "=== Fetching Availability Domains ==="
          JSON=$(oci iam availability-domain list --compartment-id "$COMPARTMENT_ID" --output json)
          mapfile -t AD_LIST < <(echo "$JSON" | jq -r '.data[].name // empty')
          echo "Found ${#AD_LIST[@]} AD(s): ${AD_LIST[*]}"

          SUCCESS=false
          INSTANCE_ID=""

          for i in "${!AD_LIST[@]}"; do
            [ $i -ge 3 ] && break
            AD="${AD_LIST[$i]}"
            echo ""
            echo "=== Attempt $((i+1))/3 in AD: $AD ==="

            # === REAL ERROR CAPTURE (this was the bug before) ===
            set +e
            RESULT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "instance-20260319-1131" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 200 \
              --boot-volume-vpus-per-gb 10 \
              --is-pv-encryption-in-transit-enabled true \
              --ssh-authorized-keys-file /tmp/ssh_pub_key.pub \
              --agent-config "$AGENT" \
              --availability-config '{"recoveryAction":"RESTORE_INSTANCE"}' \
              2>&1)
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              INSTANCE_ID=$(echo "$RESULT" | jq -r '.data.id // "unknown"')
              echo "✅ SUCCESS! Instance created in $AD"
              echo "Instance ID: $INSTANCE_ID"
              SUCCESS=true
              break
            else
              echo "❌ Failed in $AD (exit code $EXIT_CODE)"
              echo "$RESULT"
              echo ""
              if echo "$RESULT" | grep -qi "out of host capacity"; then
                echo "→ OUT OF HOST CAPACITY (Chicago region is full right now)"
              elif echo "$RESULT" | grep -qi "LimitExceeded\|quota"; then
                echo "→ QUOTA EXCEEDED (check boot volumes in console)"
              else
                echo "→ See full error above"
              fi
            fi
          done

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          [ "$SUCCESS" = "true" ] && echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          if [ "$SUCCESS" = "false" ]; then
            echo "❌ All 3 ADs failed - will retry in 5 min."
          fi

      - name: Disable workflow on success
        if: steps.check.outputs.exists == 'true' || steps.create.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows --jq '.workflows[] | select(.name == "OCI Create Instance") | .id')
          gh api --method PUT repos/$REPO/actions/workflows/$WORKFLOW_ID/disable
          echo "Workflow disabled - instance is running."
